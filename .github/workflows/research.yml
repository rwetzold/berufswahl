name: Fetch public labour-market sources
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download public BA page and linked scripts
        shell: python
        run: |
          import urllib.request, re, pathlib, urllib.parse
          root=pathlib.Path('research'); root.mkdir()
          url='https://statistik.arbeitsagentur.de/DE/Navigation/Statistiken/Interaktive-Statistiken/Fachkraeftebedarf/Engpassanalyse-Nav.html'
          text=urllib.request.urlopen(url,timeout=60).read().decode('utf8')
          (root/'engpass.html').write_text(text)
          for i,src in enumerate(re.findall(r'<script[^>]+src="([^"]+)"',text)):
            full=urllib.parse.urljoin(url,src.replace('&amp;','&'))
            try:
              body=urllib.request.urlopen(full,timeout=60).read()
              (root/f'script-{i}.js').write_bytes(body)
              (root/f'script-{i}.url').write_text(full)
            except Exception as e: print(full,str(e))
      - uses: actions/upload-artifact@v4
        with:
          name: public-sources
          path: research/
